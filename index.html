<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muntadhar Mahdi Habib Al-Sabaa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 40px 20px;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 20px;
        }
        h1 { margin: 10px 0; font-size: 24px; }
        p { color: #666; font-size: 16px; line-height: 1.5; }
        .links { margin-top: 20px; }
        .links a {
            display: inline-block;
            margin: 5px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .links a:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <img src="profile.jpg" alt="Muntadhar Profile">
        <h1>Muntadhar Mahdi Habib Al-Sabaa</h1>
        <p>Professional. Innovative. Driven by results.</p>
        <p>Welcome to my digital portfolio. I am ready to add value and create impactful solutions.</p>
        
        <div class="links">
            <!-- استبدل الرابط أدناه برابط حسابك في لينكد إن -->
            <a href="https://www.linkedin.com/" target="_blank">LinkedIn</a>
            <a href="https://github.com/fixer-intj" target="_blank">GitHub</a>
            <!-- استبدل البريد أدناه ببريدك الإلكتروني -->
            <a href="mailto:your-email@example.com">Email Me</a>
        </div>
    </div>
</body>
</html>
